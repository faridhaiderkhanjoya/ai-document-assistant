
name: AI Document Assistant CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile backend/main.py

      - name: Run Ruff lint checks
        run: ruff check backend/main.py backend/tests/test_api.py

      - name: Audit production dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Run API tests
        run: python -m pytest -v backend/tests/

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(JSON.stringify({
              issuer: payload.iss,
              audience: payload.aud,
              subject: payload.sub
            }, null, 2));

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy application through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          REMOTE_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          IMAGE="ghcr.io/faridhaiderkhanjoya/ai-document-assistant:latest"
          CONTAINER="ai-document-assistant"
          PREVIOUS="ai-document-assistant-previous"
          ENV_FILE="/home/ubuntu/ai-document-assistant.env"

          echo "Pulling latest Docker image..."
          docker pull "$IMAGE"

          echo "Preparing previous container for rollback..."
          docker rm -f "$PREVIOUS" 2>/dev/null || true

          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            docker stop "$CONTAINER"
            docker rename "$CONTAINER" "$PREVIOUS"
          fi

          echo "Starting new application container..."

          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8000:8000 \
            "$IMAGE"; then

            if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
              docker rename "$PREVIOUS" "$CONTAINER"
              docker start "$CONTAINER"
            fi

            exit 1
          fi

          echo "Checking application health..."

          ATTEMPT=1

          while [ "$ATTEMPT" -le 30 ]; do
            if docker exec "$CONTAINER" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"; then

              echo "Application is healthy."

              docker rm -f "$PREVIOUS" 2>/dev/null || true
              exit 0
            fi

            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Health check failed. Rolling back..."

          docker logs "$CONTAINER" || true
          docker rm -f "$CONTAINER" || true

          if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
            docker rename "$PREVIOUS" "$CONTAINER"
            docker start "$CONTAINER"
          fi

          exit 1
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for ATTEMPT in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment monitoring timed out."
          exit 1
